# All tunable choices live here so they are visible and auditable in one place.

data:
  raw_csv: data/raw/HI-Small_Trans.csv
  patterns_txt: data/raw/HI-Small_Patterns.txt
  transactions_parquet: data/processed/transactions.parquet

# Decided in Phase 1 (see notebooks/01_explore.ipynb)
# Label B: an account is a mule if, inside the window, it both received and sent
# at least one laundering transfer (self-transfers excluded).
label: B_pass_through

# Time-based split. Start dates are inclusive, end dates exclusive.
# data_end drops Sep 11-18: normal customers stop there and only laundering
# chains continue (a simulator artifact that would leak "active late = criminal").
split:
  data_start: "2022-09-01"
  cut_date: "2022-09-07"     # first day of TEST; train = Sep 1-6, test = Sep 7-10
  data_end: "2022-09-11"

# Phase 5 evaluation. Cost numbers are ASSUMPTIONS, not bank figures.
alerts_per_day: 50
cost_per_review_inr: 500
cost_per_missed_mule_inr: 50000
