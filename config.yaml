# All tunable choices live here so they are visible and auditable in one place.

data:
  raw_csv: data/raw/HI-Small_Trans.csv
  patterns_txt: data/raw/HI-Small_Patterns.txt
  transactions_parquet: data/processed/transactions.parquet

# Decided in Phase 1 (see notebooks/01_explore.ipynb)
# Label B: an account is a mule if, inside the window, it both received and sent
# at least one laundering transfer (self-transfers excluded).
label: B_pass_through

# Time-based split. Start dates are inclusive, end dates exclusive.
# data_end drops Sep 11-18: normal customers stop there and only laundering
# chains continue (a simulator artifact that would leak "active late = criminal").
split:
  data_start: "2022-09-01"
  cut_date: "2022-09-07"     # first day of TEST; train = Sep 1-6, test = Sep 7-10
  data_end: "2022-09-11"
  # Phase 5 tuning: the training period split again by time.
  # inner_train = Sep 1-4 (models learn), validation = Sep 5-6 (settings and cost cut-off chosen)
  validation_start: "2022-09-05"

# Phase 2 feature settings
features:
  dwell_fill_hours: 168        # dwell time for accounts with no in->out pair: one week, longer than any window
  round_amount_multiple: 100   # "round" = whole multiple of this, in the transfer's own currency
  pass_through_ratio_cap: 10   # out/in can explode when in is tiny; cap so a few accounts don't dominate scaling

# Phase 3 rules. Thresholds were proposed from TRAINING percentiles and chosen in Phase 3
# (evidence: notebooks/02_rules.ipynb). Counts are per day so the 6-day train window and
# 4-day test window mean the same thing.
rules:
  R1_RAPID_PASS_THROUGH:
    max_dwell_hours: 48            # strictly less than; mules in this simulator hold money ~1 day
    min_pass_through_ratio: 0.8    # forwards 80% to 120% of what it receives (inclusive)
    max_pass_through_ratio: 1.2
  R2_FAN_IN:
    min_fan_in_per_day: 1.0        # 6 distinct senders in 6 days, about p99 of active accounts
  R3_FAN_OUT:
    min_fan_out_per_day: 1.333     # 8 distinct receivers in 6 days, about p99 of active accounts
  R4_NEW_AND_BURSTY:
    min_first_seen_frac: 0.5       # first appears in the second half of the window
    min_burst_share: 0.8           # 80%+ of its transfers fall in its busiest 24 hours
    min_txn_per_day: 0.5           # 3+ transfers in 6 days; burst is meaningless for 1-2 transfers
  R5_HIGH_RISK_CHANNEL:
    min_cash_bitcoin_share: 0.5
  R6_CROSS_BANK_HOPS:
    min_cross_bank_out_share: 1.0  # every outgoing transfer goes to another bank
    min_out_per_day: 0.5           # 3+ outgoing transfers in 6 days, so it is a pattern, not one payment

  # Rules-only baseline score = sum of weights of the rules that fire.
  # Weight = training lift (precision / base rate), rounded. R5 and R6 had lift ~0.1 and ~2 on
  # this data: they stay as reason codes but get weight 0 so they don't add noise to the ranking.
  weights:
    R1_RAPID_PASS_THROUGH: 16
    R2_FAN_IN: 6
    R3_FAN_OUT: 4
    R4_NEW_AND_BURSTY: 17
    R5_HIGH_RISK_CHANNEL: 0
    R6_CROSS_BANK_HOPS: 0

# Phase 4 graph features. In/out/weighted degree are NOT recomputed: they equal
# fan_in_per_day, fan_out_per_day and in/out_usd_per_day from Phase 2.
graph:
  pagerank_alpha: 0.85              # standard damping: 15% chance of "jumping" to a random account
  cycle_max_length: 4               # loops of 2, 3 or 4 hops
  cycle_hub_max_degree: 72          # accounts with more counterparties (top 0.01% in train) are not
                                    # followed in the loop search: they make it explode and loops through
                                    # payment-processor-sized hubs mean little
  cycle_time_limit_minutes: 20      # per window; if exceeded, the cycle feature is dropped and reported

# Phase 5 evaluation. Cost numbers are ASSUMPTIONS, not bank figures.
alerts_per_day: 50
cost_per_review_inr: 500
cost_per_missed_mule_inr: 50000
